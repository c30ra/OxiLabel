[workspace]
resolver = "3"
members = ["crates/oxilabel-core", "crates/oxilabel-server", "crates/oxilabel-formats", "crates/oxilabel-ui", "crates/oxilabel-cli"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "GPL-3.0-or-later"

# Password hashing is far too slow unoptimised; tests log in many times.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
