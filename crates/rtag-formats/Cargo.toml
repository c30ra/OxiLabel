[package]
name = "rtag-formats"
edition.workspace = true
version.workspace = true

[dependencies]
blake3 = "1"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
rtag-core = { path = "../rtag-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
