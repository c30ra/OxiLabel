[package]
name = "rtag-ui"
edition.workspace = true
version.workspace = true

[dependencies]
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
rtag-core = { path = "../rtag-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "BeforeUnloadEvent",
    "CanvasRenderingContext2d",
    "DomRect",
    "File",
    "FileList",
    "FormData",
    "HtmlInputElement",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "ImageData",
    "PointerEvent",
    "Storage",
    "TextMetrics",
    "WheelEvent",
] }
