[package]
name = "oxilabel-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# `fake_worker`: an in-process pre-annotation worker for the server's and the CLI's tests.
fake-worker = []

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
argon2 = "0.5"
# The operating system's random numbers, for salts and session tokens.
password-hash = { version = "0.5", features = ["getrandom"] }
blake3 = "1"
# Turns a long operation's progress into server-sent events.
futures-util = { version = "0.3", default-features = false }
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
# Stops the worker's whole process group on shutdown.
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "tiff", "webp"] }
regex = "1"
# Calls the pre-annotation worker over local HTTP (ADR 0001).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
oxilabel-core = { path = "../oxilabel-core" }
oxilabel-formats = { path = "../oxilabel-formats" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "regexp"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
oxilabel-server = { path = ".", features = ["fake-worker"] }
tower = { version = "0.5", features = ["util"] }
